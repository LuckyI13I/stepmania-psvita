# Default font.  This font is loaded behind every other font.
[main]
0=24
1=26

Top=3
Bottom=29

map default=0
map invalid=1

# Load the default 16-pixel glyphs.  They can be overridden by fonts
# later.
# VITA: CJK pages (_chinese/_japanese/_korean 24px, ~5MB PNGs) dropped:
# first font use stalled ~30s decoding them on Vita CPU, and EN text
# never touches those codepoints. CJK song titles show tofu instead.
import=_16px fonts,_misc 16px,_game chars 16px